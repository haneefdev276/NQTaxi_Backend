# Local PostgreSQL for development.
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f db

services:
  db:
    image: postgres:16-alpine
    container_name: nqtaxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conzura_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nqtaxi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conzura_data"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nqtaxi_pgdata:
